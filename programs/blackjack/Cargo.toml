[package]
name = "blackjack"
version = "0.1.0"
edition = "2021"
description = "Two-player blackjack escrow on Solana"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "blackjack"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.cargo]
# Rustc still treats this crate as used. Cargo 1.100's unused_dependencies
# lint does not, and removing it breaks the program.
unused_dependencies = "allow"

[dependencies]
anchor-lang = "1.2.2"
blackjack-logic = { path = "../blackjack-logic" }
# Host builds need the sha2 feature. The Solana target ignores it and uses sol_sha256.
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
